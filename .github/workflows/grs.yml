name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=806E56
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=806E56
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pin card 1
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=serplay&repo=AirLight&bg_color=806E56
          path: profile/pin-serplay-AirLight.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate pin card 2
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=serplay&repo=AnyPass&bg_color=806E56
          path: profile/pin-serplay-AnyPass.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate pin card 3
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=serplay&repo=JustTouch&bg_color=806E56
          path: profile/pin-serplay-JustTouch.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate pin card 4
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=serplay&repo=manhwa-downloader&bg_color=806E56
          path: profile/pin-serplay-manhwa-downloader.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate wakatime card
        uses: readme-tools/github-readme-stats-action@v1
        with:
            card: wakatime
            options: username=serplay&layout=compact&bg_color=806E56
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push